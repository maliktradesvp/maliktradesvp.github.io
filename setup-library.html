<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup Library · MalikTrades</title>
<meta name="description" content="Real trades from MalikTrades sessions, sorted by setup and instrument.">
<meta name="theme-color" content="#21414A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="/MalikTradesJournal/banner.jpg">
<link rel="stylesheet" href="/mt-shell.css">
<style>
a{color:inherit}
button{font:inherit;color:inherit}
.lib{max-width:1320px;margin:0 auto;padding:28px 36px 40px;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.ph .k{font-size:11px;letter-spacing:.22em;font-weight:700;color:var(--gold)}
h1{font-family:var(--display);font-weight:600;font-size:46px;line-height:1;margin:4px 0 6px;color:var(--teal)}
.ph p{margin:0;color:var(--mut);max-width:60ch}
.stats{display:flex;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 16px;text-align:center;min-width:88px}
.stat b{display:block;font-size:22px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11.5px;color:var(--mut)}
.frombar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(160deg,#21414A,#1A333A);color:#E9E2D3;border-radius:14px;padding:12px 16px;margin-bottom:12px;font-size:14.5px}
.frombar b{color:#fff}.frombar .fx{margin-left:auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:9px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}
.frombar .fx:hover{background:rgba(255,255,255,.18)}
.filters{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fg{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fg .lab{width:96px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:700}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;background:#FBF7EF;cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--teal2)}
.chip i{font-style:normal;opacity:.55;margin-left:4px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.chip[aria-pressed="true"] i{opacity:.75}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;box-shadow:0 10px 30px -22px rgba(33,65,74,.35);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 34px -18px rgba(33,65,74,.45)}
.card .im{position:relative;height:220px;overflow:hidden;background:#E8E2D6;border-bottom:1px solid var(--line)}
.card .im img{width:100%;height:100%;object-fit:cover;object-position:center 60%;display:block;transform:scale(1.08)}
.card .im .r{position:absolute;top:10px;right:10px;color:#fff;font-weight:700;font-size:13px;padding:3px 9px;border-radius:7px;background:var(--win)}
.card .im .r.l{background:var(--loss)}.card .im .r.b{background:#6E746F}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.tags{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:11.5px;font-weight:700;border-radius:5px;padding:2px 8px;background:var(--tealsoft);color:var(--teal2)}
.tag.s{background:var(--teal);color:#fff}
.tag.g{background:transparent;color:var(--gold);letter-spacing:1px;padding:2px 2px;font-size:12.5px}
.tag.d{background:var(--winbg);color:var(--win)}
.tag.d.sh{background:var(--lossbg);color:var(--loss)}
.card h3{font-family:var(--display);font-weight:600;font-size:22px;margin:0;line-height:1.15}
.card p{color:var(--mut);font-size:14px;margin:5px 0 0;line-height:1.45}
.meta{display:flex;justify-content:space-between;margin-top:auto;padding-top:12px;font-size:13px;color:var(--mut)}
.res{font-weight:700}.res.w{color:var(--win)}.res.l{color:var(--loss)}.res.b{color:var(--mut)}
.empty{border:1px dashed var(--line);border-radius:16px;padding:40px 24px;text-align:center;color:var(--mut);background:var(--card)}
.empty b{display:block;font-family:var(--display);font-size:26px;color:var(--ink);font-weight:600;margin-bottom:4px}
/* detail view */
.ov{position:fixed;inset:0;background:rgba(18,36,40,.72);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.ov.open{display:flex}
.dlg{width:100%;max-width:1040px;background:linear-gradient(140deg,#1C3A41,#27494F);color:#EEE7D8;border-radius:22px;overflow:hidden;position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.dlg .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(238,231,216,.25);background:rgba(20,40,44,.8);color:#fff;cursor:pointer;font-size:20px;line-height:1;z-index:2}
.dlg .imgs{padding:14px;display:flex;flex-direction:column;gap:10px}
.dlg .imgs img{width:100%;max-height:78vh;object-fit:contain;display:block;background:#E8E2D6;border-radius:14px}
.dlg .body{padding:26px 26px 26px 12px;display:flex;flex-direction:column;min-width:0}
.dlg .tags .tag{background:rgba(255,255,255,.1);color:#DCE4E1}.dlg .tags .tag.s{background:var(--gold2);color:var(--teal)}
.dlg .tags .tag.d{background:rgba(127,211,158,.18);color:#9FDDB6}.dlg .tags .tag.d.sh{background:rgba(240,127,110,.18);color:#F3A79A}
.dlg .tags .tag.g{background:none;color:var(--gold2)}
.dlg h2{font-family:var(--display);font-weight:600;font-size:34px;margin:6px 0 14px;line-height:1.05;text-wrap:balance}
.dlg .facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px}
.dlg .facts span{background:rgba(255,255,255,.07);border:1px solid rgba(238,231,216,.1);border-radius:10px;padding:8px 10px;font-size:9.5px;letter-spacing:.16em;color:#AFC1BD;font-weight:700;text-transform:uppercase}
.dlg .facts b{display:block;font-size:15px;letter-spacing:0;text-transform:none;color:#EEE7D8;margin-top:2px}
.dlg .notes p{margin:0 0 10px;font-size:15px;line-height:1.6;color:#DCE4E1}
.cfl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#AFC1BD;font-weight:700;margin:0 0 7px}
.cf{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.cf span{font-size:12px;font-weight:700;border:1px solid rgba(238,231,216,.25);color:#DCE4E1;border-radius:999px;padding:3px 10px}
.dlg .see{margin-top:auto;padding-top:14px;font-size:14px;color:#AFC1BD}
.dlg .see a{color:var(--gold2);font-weight:700}
@media (max-width:1100px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .lib{padding:16px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
  h1{font-size:36px}
  .fg .lab{width:100%}
  .grid{grid-template-columns:1fr}
  .ov{padding:0}
  .dlg{border-radius:0;min-height:100%;grid-template-columns:1fr}
  .dlg .body{padding:6px 18px 30px}
  .dlg h2{font-size:28px}
}
@media (min-width:1760px){ .lib{max-width:1560px;padding:36px 56px 48px} .grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
</style>
</head>
<body data-page="library">
<div class="lib">
  <div class="ph">
    <div><div class="k">LEARN</div><h1>Setup Library</h1><p>Real trades from my sessions, broken down setup by setup. Study them until you can spot them on your own chart.</p></div>
    <div class="stats"><div class="stat"><b id="nTrades">–</b><span>trades</span></div><div class="stat"><b id="nWins">–</b><span>winners</span></div></div>
  </div>
  <div class="count" id="count" hidden></div>
  <div class="frombar" id="fromBar" hidden></div>
  <div class="filters">
    <div class="fg" role="group" aria-label="Setup"><span class="lab">Setup</span><span id="fSetup" style="display:contents"></span></div>
    <div class="fg" role="group" aria-label="Instrument"><span class="lab">Instrument</span><span id="fInst" style="display:contents"></span><span style="margin-left:auto;color:var(--mut);font-size:13.5px">Newest first</span></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="ov" id="ov" aria-hidden="true">
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <button class="x" id="dClose" aria-label="Close">×</button>
    <div class="imgs" id="dImgs"></div>
    <div class="body">
      <div class="tags" id="dTags"></div>
      <h2 id="dTitle"></h2>
      <div class="facts" id="dFacts"></div>
      <div class="notes" id="dNotes"></div>
      <div class="see" id="dSee"></div>
    </div>
  </div>
</div>

<script src="/mt-shell.js"></script>
<script>
"use strict";
const SETUPS = [
  { id:"snap",   label:"Snap",   icon:"🫰", guide:{ name:"Core Setups",     href:"/core-setups.pdf" } },
  { id:"flip",   label:"Flip",   icon:"🔄", guide:{ name:"Core Setups",     href:"/core-setups.pdf" } },
  { id:"magnet", label:"Magnet", icon:"🧲", guide:{ name:"Core Setups",     href:"/core-setups.pdf" } },
  { id:"anchor", label:"Anchor", icon:"⚓", guide:{ name:"Advanced Setups", href:"/advanced-setups.pdf" } },
  { id:"wall",   label:"The Wall", icon:"🧱", guide:{ name:"Advanced Setups", href:"/advanced-setups.pdf" } },
  { id:"whip",   label:"The Whip", icon:"⚡", guide:{ name:"Advanced Setups", href:"/advanced-setups.pdf" } }
];
const INSTRUMENTS = ["NQ", "ES", "GC", "CL"];
const state = { setup:"all", inst:"all" };
let TRADES = [];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const setupOf = id => SETUPS.find(s => s.id === id) || { label:id, icon:"" };
const fmtDate = d => { const t = new Date(d + "T00:00:00"); return isNaN(t) ? esc(d) : t.toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" }); };
const resClass = r => /^\s*-/.test(r || "") ? "l" : (/^\s*\+/.test(r || "") ? "w" : "b");
const resLabel = r => /^\s*0R?\s*$/i.test(r || "") ? "0R · Breakeven" : r;
const stars = n => n ? `<span class="tag g" title="${n} out of 4">${"★".repeat(n)}<span style="opacity:.3">${"★".repeat(Math.max(0, 4 - n))}</span></span>` : "";
const dir = d => d ? `<span class="tag d${/short/i.test(d) ? " sh" : ""}">${esc(d)}</span>` : "";

function chip(group, value, label, n){
  const on = state[group] === value;
  return `<button class="chip" type="button" data-g="${group}" data-v="${value}" aria-pressed="${on}">${label}${n != null ? ` <i>${n}</i>` : ""}</button>`;
}
function renderFilters(){
  const inInst = TRADES.filter(t => state.inst === "all" || t.instrument === state.inst);
  document.getElementById("fSetup").innerHTML = chip("setup", "all", "All", inInst.length) +
    SETUPS.map(s => chip("setup", s.id, `${s.icon} ${s.label}`, inInst.filter(t => t.setup === s.id).length)).join("");
  document.getElementById("fInst").innerHTML = chip("inst", "all", "All") + INSTRUMENTS.map(i => chip("inst", i, i)).join("");
}
function visible(){
  return TRADES.filter(t => (state.setup === "all" || t.setup === state.setup) && (state.inst === "all" || t.instrument === state.inst));
}
function renderGrid(){
  const list = visible();
  document.getElementById("count").textContent = TRADES.length
    ? `${TRADES.length} trade${TRADES.length === 1 ? "" : "s"} · new ones added daily` : "New trades added daily";
  const g = document.getElementById("grid");
  if(!TRADES.length){ g.innerHTML = `<div class="empty" style="grid-column:1/-1"><b>First trades coming soon</b>Check back after the next session.</div>`; return; }
  if(!list.length){ g.innerHTML = `<div class="empty" style="grid-column:1/-1"><b>No trades here yet</b>Try another setup or instrument.</div>`; return; }
  g.innerHTML = list.map(t => {
    const s = setupOf(t.setup), img = (t.images || [])[0];
    return `<button class="card" type="button" data-id="${esc(t.id)}">
      <div class="im">${img ? `<img src="/${esc(img)}" alt="" loading="lazy">` : ""}${t.result ? `<span class="r ${resClass(t.result)}">${esc(t.result)}</span>` : ""}</div>
      <div class="cb">
        <div class="tags"><span class="tag s">${s.icon} ${esc(s.label)}</span><span class="tag">${esc(t.instrument)}</span>${dir(t.direction)}${stars(t.stars)}</div>
        <h3>${esc(t.title)}</h3>
        ${t.summary ? `<p>${esc(t.summary.length > 120 ? t.summary.slice(0, 117).replace(/\s+\S*$/, "") + "…" : t.summary)}</p>` : ""}
        <div class="meta"><span>${fmtDate(t.date)}</span>${t.result ? `<span class="res ${resClass(t.result)}">${esc(resLabel(t.result))}</span>` : ""}</div>
      </div>
    </button>`;
  }).join("");
}
function render(){ renderFilters(); renderGrid(); }

let lastFocus = null;
function openTrade(id){
  const t = TRADES.find(x => x.id === id); if(!t) return;
  const s = setupOf(t.setup);
  document.getElementById("dImgs").innerHTML = (t.images || []).map(i => `<img src="/${esc(i)}" alt="">`).join("");
  document.getElementById("dTags").innerHTML = `<span class="tag s">${s.icon} ${esc(s.label)}</span><span class="tag">${esc(t.instrument)}</span>${dir(t.direction)}${stars(t.stars)}`;
  document.getElementById("dTitle").textContent = t.title;
  const facts = [["Date", fmtDate(t.date)], ["Rating", t.stars ? `${t.stars} out of 4` : ""], ["Entry", t.entry], ["Stop", t.stop], ["Target", t.target], ["Result", resLabel(t.result)]].filter(f => f[1]);
  document.getElementById("dFacts").innerHTML = [["Setup", `${s.icon} ${esc(s.label)}`]].concat(facts.map(([k, v]) => [k, k === "Date" ? v : esc(v)])).map(([k, v]) => `<span>${k}<b>${v}</b></span>`).join("");
  try{ history.replaceState(null, "", "#" + encodeURIComponent(t.id)); }catch(e){}
  const notes = Array.isArray(t.notes) ? t.notes : (t.notes ? [t.notes] : []);
  document.getElementById("dNotes").innerHTML = (t.confluences && t.confluences.length ? `<div class="cfl">Confluences</div><div class="cf">${t.confluences.map(c => `<span>${esc(c)}</span>`).join("")}</div><div class="cfl">Why I took it</div>` : "") + notes.map(n => `<p>${esc(n)}</p>`).join("");
  document.getElementById("dSee").innerHTML = s.guide ? `Read more: <a href="${s.guide.href}" target="_blank" rel="noopener">${s.guide.name}</a>` : "";
  lastFocus = document.activeElement;
  const ov = document.getElementById("ov"); ov.classList.add("open"); ov.setAttribute("aria-hidden", "false"); ov.scrollTop = 0;
  document.body.style.overflow = "hidden";
  document.getElementById("dClose").focus();
}
function closeTrade(){
  const ov = document.getElementById("ov"); ov.classList.remove("open"); ov.setAttribute("aria-hidden", "true");
  document.body.style.overflow = ""; if(lastFocus) lastFocus.focus();
  try{ history.replaceState(null, "", location.pathname); }catch(e){}
}

document.addEventListener("click", e => {
  const c = e.target.closest(".chip");
  if(c){ state[c.dataset.g] = c.dataset.v; document.getElementById("fromBar").hidden = true; render(); return; }
  const card = e.target.closest(".card");
  if(card){ openTrade(card.dataset.id); return; }
  if(e.target.id === "ov" || e.target.id === "dClose") closeTrade();
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && document.getElementById("ov").classList.contains("open")) closeTrade(); });

fetch("/setup-library.json?v=" + Date.now()).then(r => r.ok ? r.json() : []).catch(() => []).then(data => {
  TRADES = (Array.isArray(data) ? data : (data.trades || [])).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  applyParams();
  render();
  const w = TRADES.filter(t => resClass(t.result) === "w").length;
  document.getElementById("nTrades").textContent = TRADES.length; document.getElementById("nWins").textContent = w;
  const h = decodeURIComponent(location.hash.slice(1)); if(h && TRADES.some(t => t.id === h)) openTrade(h);
});
function applyParams(){
  const q = new URLSearchParams(location.search), st = q.get("setup"), ins = (q.get("inst") || "").toUpperCase();
  if(!st && !ins) return;
  if(st && SETUPS.some(x => x.id === st)) state.setup = st;
  if(INSTRUMENTS.includes(ins)) state.inst = ins;
  if(!visible().length) state.inst = "all";
  const bar = document.getElementById("fromBar"), su = setupOf(state.setup);
  const n = visible().length;
  bar.innerHTML = `<span>${q.get("from") === "journal" ? "\u{1F4D3} From your journal: " : ""}showing <b>${n} ${su.icon} ${esc(su.label)}</b> example${n === 1 ? "" : "s"}${state.inst !== "all" ? ` on <b>${esc(state.inst)}</b>` : ""}. Compare them with the trade you logged.</span><button class="fx" type="button" id="fromAll">Show all trades</button>`;
  bar.hidden = false;
  document.getElementById("fromAll").onclick = () => { state.setup = "all"; state.inst = "all"; bar.hidden = true; history.replaceState(null, "", location.pathname); render(); };
}
window.addEventListener("hashchange", () => { const h = decodeURIComponent(location.hash.slice(1)); if(h && TRADES.some(t => t.id === h)) openTrade(h); });
</script>
</body>
</html>
